appId: com.pranavsairam.miko
productName: MIKO
copyright: Copyright © PRANAV SAIRAM
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/*.{md,map}"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  # Knowledge reads PDFs with pdfjs-dist's legacy (Node) build only; skip its browser viewer and extras.
  - "!**/node_modules/pdfjs-dist/{build,web,image_decoders,types}/**"
  - "!**/node_modules/pdfjs-dist/legacy/{web,image_decoders}/**"
  - "!**/node_modules/pdfjs-dist/legacy/build/*.min.mjs"
  - "!**/node_modules/pdfjs-dist/legacy/build/pdf.{sandbox,renderer}.*"
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
  - from: pet_animals
    to: pet_animals
    filter:
      - "**/*.glb"
      - "**/*.png"
      - "!**/_*"
      - "!**/.DS_Store"
  # Ensures dir builds also ship a feed file (zip/dmg already emit one).
  - from: build/app-update.yml
    to: app-update.yml

asar: true
asarUnpack:
  - out/renderer/**/*.glb
# Generic HTTPS feed for invited beta — no GitHub token in the desktop app.
# URL is supplied at release time via MIKO_UPDATE_URL (see scripts/release-beta.mjs).
# Channel "beta" publishes beta-mac.yml / beta.yml independently of future "latest".
# Overridden at release time: electron-builder -c.publish.url="$MIKO_UPDATE_URL"
# Placeholder is rewritten into app-update.yml; testers never need GitHub credentials.
publish:
  provider: generic
  url: http://127.0.0.1:8791/beta/
  channel: beta
  publishAutoUpdate: true
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # Free beta: ad-hoc sign ("-"), NOT identity:null.
  # identity:null leaves only the linker stub → codesign verify fails with
  # "code has no resources but signature indicates they must be present" and
  # Gatekeeper on other Macs shows the unrecoverable “App is damaged” dialog.
  # Ad-hoc seals Resources; Gatekeeper may still say “Apple could not verify”
  # (bypass via right-click Open / Open Anyway). Notarization still needs Developer ID.
  identity: "-"
  # build/icon.png is the 256 px Windows art; macOS needs >= 512 px (electron-builder refuses smaller).
  icon: build/icon-mac.png
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: MIKO-${version}-${arch}-mac.${ext}
  extendInfo:
    LSUIElement: true
dmg:
  artifactName: MIKO-${version}-${arch}.${ext}
# Windows NSIS installer for owner PC testing / dad handoff.
# Does not bundle userData, login credentials, or miko-settings.json.
# Unsigned: SmartScreen may warn; auto-update feed is not enabled for Windows distribution.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: MIKO-${version}-win-${arch}.${ext}
  # Keep installer naming portable and version-derived (e.g. MIKO-0.1.1-win-x64.exe).
# One-click, per-user install (no admin prompt): progress bar, then MIKO starts.
# Start menu shortcut always; the desktop shortcut and start-at-sign-in are opt-in inside MIKO
# (Help & Setup). Upgrades keep %APPDATA%\MIKO-Beta (settings, ChatGPT session); uninstall keeps it
# too and says so (build/installer.nsh).
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: MIKO
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  # Never ship personal Application Support / AppData profiles inside the installer.
