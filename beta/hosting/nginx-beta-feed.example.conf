# Example nginx site for the generic beta update feed (HTTPS).
# Place artifacts under /var/www/miko/beta/ (zip, dmg, beta-mac.yml, *.blockmap).
# TLS via certbot or your existing certs. No app secrets on this host.

server {
  listen 443 ssl http2;
  server_name updates.example.com;

  # ssl_certificate     /etc/letsencrypt/live/updates.example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/updates.example.com/privkey.pem;

  root /var/www;
  location /miko/beta/ {
    alias /var/www/miko/beta/;
    autoindex off;
    add_header Cache-Control "public, max-age=60";
    types {
      text/yaml yml;
      application/zip zip;
      application/octet-stream dmg blockmap;
    }
  }
}

server {
  listen 80;
  server_name updates.example.com;
  return 301 https://$host$request_uri;
}
